# docker compose up  ->  http://localhost:8787 en mode demo (aucune cle).
# Pour le vrai jeu : retire CC_DEMO et passe un fichier .env (env_file ci-dessous).
services:
  command-center:
    build: .
    ports:
      - "127.0.0.1:8787:8787"
    environment:
      CC_DEMO: "1"
    # env_file: .env
    volumes:
      - cc-data:/app/data
volumes:
  cc-data:
