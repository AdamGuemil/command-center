[project]
name = "shroud-command-center"
version = "0.6.0"
description = "Live-ops console for a Roblox experience: live servers, season automation, player actions, notifications, Discord."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<0.116", "uvicorn>=0.32,<0.33"]

[project.optional-dependencies]
discord = ["discord.py>=2.4", "aiohttp>=3.9"]   # bot (CC_BOT=1) et tools/setup_discord.py
dev = ["pytest==8.3.3", "ruff==0.7.4", "mypy==1.13.0", "httpx==0.27.2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = ["data", "web"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Scripts Discord historiques, a fusionner dans le service (lot 5b) : style compact assume.
"tools/setup_discord.py" = ["E701", "E702", "B008", "E402"]
"tests/*" = ["E402"]

[tool.mypy]
python_version = "3.11"
files = ["core", "server.py", "app.py"]
ignore_missing_imports = true
check_untyped_defs = false
warn_unused_ignores = false
no_implicit_optional = false

# discord.py type chaque salon et chaque auteur comme une union (DM, groupe, fil...). Les
# commandes du bot ne servent que dans le serveur : ces unions ne s'y presentent pas.
[[tool.mypy.overrides]]
module = "core.bot"
disable_error_code = ["union-attr", "arg-type"]
