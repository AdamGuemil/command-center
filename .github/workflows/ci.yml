name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: Ruff
        run: ruff check .
      - name: Mypy
        run: mypy

  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r requirements-dev.txt
      - run: pytest

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-save playwright@1.48.2 && npx playwright install --with-deps chromium
      - name: Interface Live et Fiches (API simulee)
        run: node tests/e2e/browser_live.cjs

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t shroud-cc .
      - name: Smoke test (mode heberge, aucune cle Roblox)
        run: |
          docker run -d --name cc -p 8787:8787 \
            -e DISCORD_CLIENT_ID=1 -e DISCORD_CLIENT_SECRET=ci -e CC_ADMINS=1 \
            -e CC_PUBLIC_URL=https://cc.example.test -e CC_JOBS=0 -e CC_WATCH=0 shroud-cc
          for i in $(seq 1 30); do curl -sf -o /dev/null http://127.0.0.1:8787/healthz && break; sleep 1; done
          curl -sf http://127.0.0.1:8787/healthz | grep -q '"ok":true'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8787/)" = 303
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8787/api/live)" = 401
          curl -sf http://127.0.0.1:8787/login | grep -q "Se connecter avec Discord"
          docker logs cc
      - name: Refuse d'etre expose sans connexion
        run: |
          set +e
          timeout 30 docker run --rm shroud-cc
          code=$?
          test "$code" = 1 || { echo "attendu : refus au demarrage (code 1), obtenu $code"; exit 1; }

  # Image publiee sur ghcr.io a chaque push vert sur main : c'est elle que le serveur tire.
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint-and-types, tests, ui, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Nom de l'image (minuscules, exige par ghcr.io)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # x86 (AMD) et ARM (Ampere) : les deux formes de serveur gratuit d'Oracle Cloud.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - run: |
          docker buildx build --platform linux/amd64,linux/arm64 --push \
            -t "$IMAGE:latest" -t "$IMAGE:${GITHUB_SHA::7}" .

  # Deploiement : seulement si la variable DEPLOY_HOST est definie (Settings > Secrets and
  # variables > Actions). La cle SSH ne peut lancer QUE deploy/deploy.sh sur le serveur
  # (commande forcee dans authorized_keys) ; le script revient seul a l'image precedente si
  # le CC ne repond pas, et le job passe alors en rouge.
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_HOST != ''
    needs: [publish]
    runs-on: ubuntu-latest
    environment: production
    concurrency: production
    steps:
      - name: Mise a jour du serveur
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          HOST: ${{ vars.DEPLOY_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy -o StrictHostKeyChecking=yes "deploy@$HOST" deploy